<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="ONCE — 一度だけ、そっと届ける画像共有。">
  <title>ONCE — One view, then gone.</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#191b20;--muted:#a4a7b0;--line:#30323a;--accent:#d9ff72;--danger:#ff8d8d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#252a1b 0,transparent 38%),var(--bg);color:#f6f6f2;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px 18px;display:grid;place-items:center}
    main{width:min(100%,560px);text-align:center}.mark{width:48px;height:48px;border:1px solid #555b45;border-radius:16px;display:grid;place-items:center;margin:0 auto 22px;color:var(--accent);font-size:22px;font-weight:800}
    .eyebrow{font-size:10px;letter-spacing:.22em;color:var(--accent);font-weight:700}h1{font-size:clamp(46px,12vw,72px);letter-spacing:-.075em;margin:10px 0 5px}.sub{color:var(--muted);font-size:14px;line-height:1.8;margin:0 auto 26px}
    .panel{background:linear-gradient(145deg,#1c1e23,#17191d);border:1px solid var(--line);border-radius:22px;padding:25px;text-align:left;box-shadow:0 24px 80px #0005}
    h2{font-size:15px;margin:0 0 8px}.hint{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 18px}
    .drop{display:block;border:1px dashed #555b45;border-radius:16px;padding:24px 16px;text-align:center;cursor:pointer;transition:.2s}.drop:hover{border-color:var(--accent);background:#d9ff7208}.drop input{position:absolute;width:1px;height:1px;opacity:0}.drop strong{display:block;font-size:13px}.drop span{display:block;color:var(--muted);font-size:11px;margin-top:6px}
    .preview{display:none;width:100%;max-height:280px;object-fit:contain;border-radius:12px;margin-top:14px;background:#0b0c0e}
    button,.share-link{width:100%;border:0;border-radius:13px;padding:14px 16px;background:var(--accent);color:#171910;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;display:block;text-align:center;margin-top:14px}
    button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#292c32;color:#f6f6f2;border:1px solid var(--line)}
    .status{font-size:12px;line-height:1.7;color:var(--muted);margin:15px 0 0;overflow-wrap:anywhere}.status.error{color:var(--danger)}.sharebox{display:none;margin-top:18px;padding:15px;border:1px solid var(--line);border-radius:14px}.sharebox code{display:block;font-size:11px;line-height:1.7;overflow-wrap:anywhere;color:#e8eddb}
    .image-view{display:none;margin-top:18px}.image-view img{display:none;width:100%;max-height:65vh;object-fit:contain;border-radius:14px;background:#08090b}.timer{font-size:11px;color:var(--muted);margin-top:10px}
    footer{color:#747781;font-size:10px;margin-top:24px;letter-spacing:.08em}
    @media(max-width:420px){.panel{padding:20px}}
  </style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">1</div>
  <div class="eyebrow">ONE VIEW. THEN GONE.</div>
  <h1>ONCE</h1>
  <p class="sub">一度だけ、そっと届ける。<br>見終わった画像は、もう開けない。</p>

  <section class="panel" id="sendPanel">
    <h2>画像を送る</h2>
    <p class="hint">画像を選ぶと、1回だけ開ける共有リンクを作成します。対応形式：JPEG・PNG・WebP（最大10MB）</p>
    <label class="drop" for="fileInput">
      <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp">
      <strong id="fileLabel">画像を選択</strong>
      <span>タップまたはクリックして選ぶ</span>
      <img id="preview" class="preview" alt="選択した画像のプレビュー">
    </label>
    <button id="sendButton" disabled>共有リンクを作成</button>
    <p id="sendStatus" class="status" role="status" aria-live="polite"></p>
    <div id="shareBox" class="sharebox">
      <p class="hint">このリンクは一度開くと再利用できません。受け取る相手だけに共有してください。</p>
      <code id="shareUrl"></code>
      <button id="copyButton" class="secondary">リンクをコピー</button>
    </div>
  </section>

  <section class="panel image-view" id="viewPanel">
    <h2 id="viewTitle">届いた画像</h2>
    <p class="hint" id="viewHint">この画像は一度だけ表示できます。準備ができたら開いてください。</p>
    <button id="openButton">画像を開く</button>
    <img id="receivedImage" alt="一度だけ表示される画像">
    <p id="viewStatus" class="status" role="status" aria-live="polite"></p>
    <p id="timer" class="timer"></p>
  </section>
  <footer>ONCE · PRIVATE IMAGE SHARING</footer>
</main>
<script>
  // Set this to the deployed Worker URL before enabling public sharing.
  const API_BASE = "https://once-api.orbit-lab-a.workers.dev";
  const MAX_BYTES = 10 * 1024 * 1024;
  const fileInput = document.getElementById("fileInput");
  const fileLabel = document.getElementById("fileLabel");
  const preview = document.getElementById("preview");
  const sendButton = document.getElementById("sendButton");
  const sendStatus = document.getElementById("sendStatus");
  const shareBox = document.getElementById("shareBox");
  const shareUrlNode = document.getElementById("shareUrl");
  const copyButton = document.getElementById("copyButton");
  const viewPanel = document.getElementById("viewPanel");
  const token = new URLSearchParams(location.search).get("once");
  let selectedFile = null;
  let previewUrl = null;
  let receivedUrl = null;
  let consumed = false;

  function status(node, message, error=false) {
    node.textContent = message;
    node.classList.toggle("error", error);
  }
  function apiReady() {
    return /^https:\/\//.test(API_BASE) && !API_BASE.includes("YOUR_");
  }
  function showApiSetup(node) {
    status(node, "現在、API接続設定中です。公開準備が整うまで送受信は利用できません。");
  }
  if (token) {
    document.getElementById("sendPanel").style.display = "none";
    viewPanel.style.display = "block";
    document.getElementById("viewTitle").textContent = "あなた宛ての画像";
    if (!apiReady()) {
      document.getElementById("openButton").disabled = true;
      status(document.getElementById("viewStatus"), "送信者側のサービス設定がまだ完了していません。時間をおいて再度お試しください。", true);
    }
  } else if (!apiReady()) {
    showApiSetup(sendStatus);
  }

  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    selectedFile = null;
    sendButton.disabled = true;
    shareBox.style.display = "none";
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    preview.removeAttribute("src");
    preview.style.display = "none";
    if (!file) { fileLabel.textContent = "画像を選択"; return; }
    if (!["image/jpeg","image/png","image/webp"].includes(file.type)) {
      status(sendStatus, "JPEG・PNG・WebP画像を選択してください。", true); return;
    }
    if (file.size > MAX_BYTES) {
      status(sendStatus, "画像は10MB以下にしてください。", true); return;
    }
    selectedFile = file;
    fileLabel.textContent = file.name;
    previewUrl = URL.createObjectURL(file);
    preview.src = previewUrl;
    preview.style.display = "block";
    sendButton.disabled = !apiReady();
    status(sendStatus, apiReady() ? "送信準備ができました。" : "API接続設定が完了するまで送信できません。");
  });

  sendButton.addEventListener("click", async () => {
    if (!selectedFile || !apiReady()) return;
    sendButton.disabled = true;
    status(sendStatus, "安全にアップロードしています…");
    try {
      const response = await fetch(API_BASE.replace(/\/$/, "") + "/api/upload", {
        method: "POST",
        headers: {"Content-Type": selectedFile.type},
        body: selectedFile,
        cache: "no-store"
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok || !data.shareUrl) throw new Error(data.error || "アップロードに失敗しました。");
      shareUrlNode.textContent = data.shareUrl;
      shareBox.style.display = "block";
      status(sendStatus, "共有リンクを作成しました。リンクは一度だけ使用できます。");
    } catch (error) {
      status(sendStatus, error.message || "通信に失敗しました。", true);
      sendButton.disabled = false;
    }
  });

  copyButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(shareUrlNode.textContent);
      copyButton.textContent = "コピーしました";
    } catch {
      status(sendStatus, "コピーできませんでした。リンクを長押ししてコピーしてください。", true);
    }
  });

  document.getElementById("openButton").addEventListener("click", async () => {
    if (!token || consumed || !apiReady()) return;
    const openButton = document.getElementById("openButton");
    const viewStatus = document.getElementById("viewStatus");
    openButton.disabled = true;
    status(viewStatus, "画像を確認しています…");
    try {
      const response = await fetch(API_BASE.replace(/\/$/, "") + "/api/view/" + encodeURIComponent(token), {
        method: "GET", cache: "no-store"
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || (response.status === 404 ? "このリンクは無効か、期限切れです。" : "画像を開けませんでした。"));
      }
      const blob = await response.blob();
      if (!blob.type.startsWith("image/")) throw new Error("画像データを確認できませんでした。");
      consumed = true;
      receivedUrl = URL.createObjectURL(blob);
      const image = document.getElementById("receivedImage");
      image.src = receivedUrl;
      image.style.display = "block";
      openButton.style.display = "none";
      document.getElementById("viewHint").textContent = "この画像は今回だけ表示されています。";
      status(viewStatus, "表示中 — 90秒後にこの画面からも画像を消します。");
      let remaining = 90;
      const timer = document.getElementById("timer");
      timer.textContent = "残り " + remaining + " 秒";
      const interval = setInterval(() => {
        remaining--;
        timer.textContent = remaining > 0 ? "残り " + remaining + " 秒" : "表示期限が終了しました";
        if (remaining <= 0) {
          clearInterval(interval);
          image.removeAttribute("src");
          image.style.display = "none";
          if (receivedUrl) URL.revokeObjectURL(receivedUrl);
          status(viewStatus, "表示期限が終了しました。このリンクは再利用できません。");
        }
      }, 1000);
    } catch (error) {
      consumed = true;
      status(viewStatus, error.message || "画像を開けませんでした。", true);
      document.getElementById("viewHint").textContent = "このリンクは使用済み、または期限切れの可能性があります。";
    }
  });
</script>
</body>
</html>
