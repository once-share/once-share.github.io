<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="ONCE — 一度だけ、そっと届ける画像共有。">
  <title>ONCE — One view, then gone.</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#191b20;--muted:#a4a7b0;--line:#30323a;--accent:#d9ff72}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#252a1b 0,transparent 38%),var(--bg);color:#f6f6f2;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px}
    main{width:min(100%,560px);text-align:center}.mark{width:54px;height:54px;border:1px solid #555b45;border-radius:18px;display:grid;place-items:center;margin:0 auto 28px;color:var(--accent);font-size:25px;font-weight:800}
    .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:700}h1{font-size:clamp(46px,12vw,76px);letter-spacing:-.075em;margin:12px 0 8px} .sub{color:var(--muted);font-size:15px;line-height:1.8;margin:0 auto 34px}
    .panel{background:linear-gradient(145deg,#1c1e23,#17191d);border:1px solid var(--line);border-radius:24px;padding:28px;text-align:left;box-shadow:0 24px 80px #0005}
    .panel h2{font-size:15px;margin:0 0 8px}.panel p{font-size:13px;color:var(--muted);line-height:1.8;margin:0}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.step{border:1px solid var(--line);border-radius:15px;padding:14px 10px}.num{color:var(--accent);font-size:11px;font-weight:700}.step strong{display:block;font-size:12px;margin-top:8px}.step span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
    .status{display:inline-flex;align-items:center;gap:8px;border:1px solid #454a37;border-radius:99px;padding:8px 12px;margin-top:24px;color:#d8e7b1;font-size:11px}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
    footer{color:#747781;font-size:10px;margin-top:30px;letter-spacing:.08em}
    @media(max-width:420px){.panel{padding:22px}.steps{gap:7px}.step{padding:12px 7px}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">1</div>
    <div class="eyebrow">ONE VIEW. THEN GONE.</div>
    <h1>ONCE</h1>
    <p class="sub">一度だけ、そっと届ける。<br>見終わった画像は、もう開けない。</p>
    <section class="panel" aria-labelledby="about">
      <h2 id="about">A little more private.</h2>
      <p>ONCEは、一度だけ見られる画像共有を目指して開発中です。共有リンクの使い切りと自動失効を、サーバー側で確実に管理する設計を進めています。</p>
      <div class="steps">
        <div class="step"><div class="num">01</div><strong>送る</strong><span>画像を選ぶ</span></div>
        <div class="step"><div class="num">02</div><strong>見る</strong><span>一度だけ開く</span></div>
        <div class="step"><div class="num">03</div><strong>消える</strong><span>期限で失効</span></div>
      </div>
    </section>
    <div class="status"><span class="dot"></span>開発中 — 送信機能はまだ利用できません</div>
    <footer>ONCE · PRIVATE IMAGE SHARING</footer>
  </main>
</body>
</html>
